# Her sabah günün maçlarını (json/today.json) ve Realistic mod için Elo puanlarını (json/ratings.json) kaydeder.
# Site bu dosyayı doğrudan GitHub'dan okur, FTP ile yüklemeye gerek yoktur.
# Elle çalıştırmak için: GitHub > Actions > "Today's matches" > Run workflow
name: Today's matches

on:
  schedule:
    - cron: "17 0 * * *" # Her gün 00:17 UTC = 03:17 Türkiye (tam saat başı GitHub yoğun olduğu için geciktiriyor)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch today's matches
        run: node tools/fetch-today.mjs
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      # Puan kaynağı o gün yanıt vermezse önceki puanlar kalır, günün maçları yine kaydedilir
      - name: Fetch Elo ratings
        run: node tools/fetch-ratings.mjs
        continue-on-error: true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add json/today.json json/ratings.json
          git diff --cached --quiet || (git commit -m "Update today's matches" && git push)
